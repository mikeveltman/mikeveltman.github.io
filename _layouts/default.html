<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: everything self-hosted; Spotify embed and external book covers allowed.
       (frame-ancestors is not supported in a meta CSP — GitHub Pages can't set headers.) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; frame-src https://open.spotify.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Apply saved theme before render to prevent flash (blocking on purpose) -->
  <script src="{{ site.baseurl }}/assets/js/theme-init.js"></script>
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.cover %}<meta property="og:image" content="{{ site.url }}{{ page.cover }}">{% elsif site.og_image %}<meta property="og:image" content="{{ site.url }}{{ site.og_image }}">{% endif %}
  <link rel="icon" href="{{ site.baseurl }}/assets/favicon.svg" type="image/svg+xml">
  <!-- Fonts are self-hosted (see _sass/_fonts.scss) — no Google Fonts requests -->
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
  {% feed_meta %}
</head>
<body{% if page.url == "/" %} class="home"{% endif %}>
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script src="{{ site.baseurl }}/assets/js/theme-toggle.js" defer></script>
</body>
</html>
